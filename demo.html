<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#edf1e9" />
    <title>贪吃蛇 · 口袋里的小游戏</title>
    <link rel="stylesheet" href="assets/style.css" />
    <script src="assets/game.js" defer></script>
    <script src="assets/app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="masthead">
        <div class="brand">
          <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <path
              d="M7 24h11a5 5 0 0 0 0-10h-5a5 5 0 0 1 0-10h9"
              stroke="#27644d"
              stroke-width="7"
              stroke-linecap="round"
            />
            <circle cx="23" cy="3" r="1.2" fill="#edf1e9" />
          </svg>
          <span>口袋游戏室</span>
        </div>
        <span class="edition">随时来一局</span>
      </header>
      <div class="intro">
        <h1>贪吃蛇</h1>
        <p>熟悉的小游戏，新的最高分。</p>
      </div>
      <div class="layout">
        <section class="console" aria-label="贪吃蛇游戏">
          <div class="scores">
            <div>
              <span class="score-label">本局得分</span
              ><output id="score" class="score-value">000</output>
            </div>
            <div class="best">
              <span class="score-label">最高纪录</span
              ><output id="best" class="score-value">000</output>
            </div>
            <div class="speed">当前速度<strong id="speed">轻松起步</strong></div>
          </div>
          <div class="screen">
            <canvas
              id="board"
              width="576"
              height="576"
              tabindex="0"
              role="img"
              aria-label="贪吃蛇棋盘"
              aria-describedby="instructions"
              >请使用支持 Canvas 的浏览器。</canvas
            >
            <div id="overlay" class="overlay">
              <div class="message">
                <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
                  <path
                    d="M10 36h18a7 7 0 0 0 0-14H18a7 7 0 0 1 0-14h16"
                    stroke="#27644d"
                    stroke-width="9"
                    stroke-linecap="round"
                  />
                  <circle cx="35" cy="6" r="1.5" fill="#edf3e2" />
                </svg>
                <h2 id="message-title">准备好开吃了吗？</h2>
                <p id="message-body">点击「开始游戏」<br />或按空格键，开始这一局。</p>
              </div>
            </div>
          </div>
          <div class="console-bottom">
            <button id="toggle" class="primary" type="button">开始游戏</button>
            <button id="restart" class="restart" type="button">重新开始</button>
            <div class="speaker" aria-hidden="true">
              <span></span><span></span><span></span><span></span>
            </div>
          </div>
        </section>
        <aside class="aside">
          <div id="status" class="status" role="status" aria-live="polite">准备就绪</div>
          <h2>多吃一口，<br />多长一格。</h2>
          <p id="instructions" class="rules">
            吃到红色果实得 10 分，速度会逐渐加快。记得转弯，别撞到墙壁或自己的身体。
          </p>
          <div class="controls">
            <h3>操作小抄</h3>
            <div class="key-help">
              <kbd>↑</kbd> <kbd>←</kbd> <kbd>↓</kbd> <kbd>→</kbd> 或 WASD 移动<br /><kbd>空格</kbd>
              开始 / 暂停<br /><kbd>Enter</kbd> 结束后再来一局
            </div>
            <div class="pad" role="group" aria-label="方向控制">
              <button type="button" data-direction="up" aria-label="向上">↑</button>
              <button type="button" data-direction="left" aria-label="向左">←</button>
              <button type="button" data-direction="down" aria-label="向下">↓</button>
              <button type="button" data-direction="right" aria-label="向右">→</button>
            </div>
          </div>
          <p class="touch-tip">手机也能玩：滑动棋盘，或轻点方向按钮。</p>
        </aside>
      </div>
      <footer><span>离开页面自动暂停</span><span>最高纪录保存在此浏览器</span></footer>
    </main>
  </body>
</html>
